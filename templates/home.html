<!DOCTYPE html>
<html>

<head>

<title>Vakya Vani</title>

<style>

/* BACKGROUND IMAGE RESTORED */

body{

margin:0;

font-family:Georgia, serif;

background:url("/static/images/bg.jpeg") center/cover fixed no-repeat;

}


/* HERO SECTION */

.hero{

height:85vh;

display:flex;

justify-content:center;

align-items:center;

}


/* CENTER CARD */

.hero-card{

background:rgba(90,60,70,.88);

padding:70px 100px;

border-radius:22px;

text-align:center;

animation:fadeUp 1.4s ease;

}


/* TITLE */

.hero-card h1{

font-size:60px;

letter-spacing:10px;

color:white;

margin-bottom:20px;

}


/* SUBTITLE */

.hero-card p{

font-size:22px;

color:#f4e2b6;

letter-spacing:2px;

margin-bottom:30px;

}


/* BUTTON */

.hero-btn{

background:#d4af37;

padding:16px 40px;

font-size:20px;

border-radius:12px;

text-decoration:none;

color:black;

transition:.3s ease;

}


/* BUTTON HOVER */

.hero-btn:hover{

background:#f2d06b;

transform:translateY(-3px);

box-shadow:0px 6px 18px rgba(0,0,0,.3);

}


/* ANIMATION */

@keyframes fadeUp{

from{

opacity:0;

transform:translateY(80px);

}

to{

opacity:1;

transform:translateY(0);

}

}

</style>

</head>

<body>


{% include "navbar.html" %}


<!-- BACKGROUND MUSIC (AUTO PLAY) -->

<audio autoplay loop hidden>

<source src="/static/audio/home_music.mp3" type="audio/mpeg">

</audio>



<!-- HERO SECTION -->

<div class="hero">

<div class="hero-card">

<h1>Vakya Vani</h1>

<p>

Where Sanskrit Meets Sound, Rhythm and Meaning

</p>

<a href="/translate" class="hero-btn">

Try Translation →

</a>

</div>

</div>


</body>

</html>
