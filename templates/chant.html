<!DOCTYPE html>
<html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@500&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">

<title>Chant Visualization | Vakya Vani</title>

<style>

body{
margin:0;
font-family:"Noto Serif Devanagari", serif;
background:#f7f3ef;
text-align:center;
}


.container{
max-width:900px;
margin:auto;
padding:60px;
}


h2{
font-family:"Playfair Display", serif;
font-size:44px;
letter-spacing:4px;
color:#4b2a3a;
}


.meter{
margin-top:20px;
font-size:22px;
}


.translation{
margin-top:15px;
font-size:18px;
color:#666;
}


#chant-container{

margin-top:50px;

font-size:42px;

line-height:80px;

}


.syllable{

padding:4px 6px;

transition:.3s ease;

}


.guru{

color:#b8860b;

}


.laghu{

color:#444;

}


.highlight{

text-shadow:

0px 0px 12px gold,

0px 0px 25px orange;

transform:scale(1.25);

}


audio{

margin-top:40px;

}

</style>

</head>

<body>

{% include "navbar.html" %}


<div class="container">

<h2>Guru–Laghu Chant Visualization</h2>


{% if meter %}
<div class="meter">
Detected Meter: <b>{{ meter }}</b>
</div>
{% endif %}


{% if translation %}
<div class="translation">
{{ translation }}
</div>
{% endif %}


<div id="chant-container">

{% for char in verse %}
<span class="syllable">{{ char }}</span>
{% endfor %}

</div>


{% if audio %}
<audio id="chant-audio" controls autoplay>
<source src="{{ url_for('static', filename=audio) }}">
</audio>
{% endif %}


</div>


<script>

const audio = document.getElementById("chant-audio");

const syllables = document.querySelectorAll(".syllable");


if(audio){

audio.addEventListener("timeupdate", ()=>{

const progress = audio.currentTime / audio.duration;

const index = Math.floor(progress * syllables.length);

syllables.forEach((s,i)=>{

if(i===index){
s.classList.add("highlight");
}
else{
s.classList.remove("highlight");
}

});

});

}

</script>


</body>
</html>
