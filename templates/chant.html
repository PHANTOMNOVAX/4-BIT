<!DOCTYPE html>
<html>

<head>

<title>Chant Visualization | Vakaya Vani</title>

<style>

body{
margin:0;
background:#ece7e4;
font-family:Georgia, serif;
}


/* PAGE CONTAINER */

.container{
max-width:1000px;
margin:auto;
padding:60px;
text-align:center;
}


/* TITLE */

h2{
letter-spacing:3px;
color:#4b2a3a;
}


/* METER DISPLAY */

.meter{
margin-top:20px;
font-size:22px;
color:#333;
}


/* TRANSLATION DISPLAY */

.translation{
margin-top:15px;
font-size:18px;
color:#555;
}


/* VERSE DISPLAY */

#chant-container{
margin-top:40px;
line-height:65px;
}


/* EACH WORD */

.word{
font-size:34px;
margin-right:12px;
transition:0.3s ease;
display:inline-block;
}


/* ACTIVE WORD */

.highlight{
color:#d4af37;
text-shadow:0px 0px 12px rgba(212,175,55,0.9);
transform:scale(1.18);
}


/* AUDIO PLAYER */

audio{
margin-top:40px;
}

</style>

</head>

<body>

{% include "navbar.html" %}


<div class="container">


<h2>Live Chant Visualization</h2>


<!-- METER -->

{% if meter %}
<div class="meter">
Detected Meter: <b>{{ meter }}</b>
</div>
{% endif %}


<!-- TRANSLATION -->

{% if translation %}
<div class="translation">
{{ translation }}
</div>
{% endif %}


<!-- VERSE DISPLAY -->

<div id="chant-container">

{% for word in verse.split() %}

<span class="word">{{ word }}</span>

{% endfor %}

</div>


<!-- AUDIO PLAYER -->

{% if audio %}
<audio id="chant-audio" controls>

<source src="{{ audio }}" type="audio/mpeg">

</audio>
{% endif %}


</div>


<script>

/* AUDIO + WORD ELEMENTS */

const audio = document.getElementById("chant-audio");
const words = document.querySelectorAll(".word");


if(audio){

audio.addEventListener("play", ()=>{

const totalDuration = audio.duration * 1000;

const timePerWord = totalDuration / words.length;


/* RESET HIGHLIGHTS */

words.forEach(word=>{
word.classList.remove("highlight");
});


/* START LOOP */

words.forEach((word, index)=>{

setTimeout(()=>{

word.classList.add("highlight");

if(index>0){
words[index-1].classList.remove("highlight");
}

}, timePerWord * index);

});

});


/* RESET AFTER AUDIO ENDS */

audio.addEventListener("ended", ()=>{

words.forEach(word=>{
word.classList.remove("highlight");
});

});

}

</script>


</body>

</html>
