<!DOCTYPE html>
<html>

<head>

<title>Chant Visualization | Vakaya Vani</title>

<style>

body{
margin:0;
background:#ece7e4;
font-family:Georgia, serif;
}


/* PAGE CONTAINER */

.container{
max-width:900px;
margin:auto;
padding:60px;
text-align:center;
}


/* VERSE DISPLAY */

#chant-container{
margin-top:40px;
line-height:60px;
}


/* EACH WORD */

.word{
font-size:34px;
margin-right:12px;
transition:0.3s ease;
display:inline-block;
}


/* ACTIVE WORD HIGHLIGHT */

.highlight{
color:#d4af37;
text-shadow:0px 0px 12px rgba(212,175,55,0.9);
transform:scale(1.15);
}


/* AUDIO PLAYER */

audio{
margin-top:40px;
}


</style>

</head>

<body>

{% include "navbar.html" %}


<div class="container">

<h2>Live Chant Visualization</h2>


<!-- VERSE DISPLAY -->

<div id="chant-container">

{% for word in verse.split() %}

<span class="word">{{ word }}</span>

{% endfor %}

</div>


<!-- AUDIO PLAYER -->

<audio id="chant-audio" controls>

<source src="/static/audio/output.mp3" type="audio/mpeg">

</audio>


</div>


<script>

/* GET AUDIO + WORDS */

const audio = document.getElementById("chant-audio");
const words = document.querySelectorAll(".word");


/* ESTIMATE TIMING AUTOMATICALLY */

function highlightWords(){

const totalDuration = audio.duration * 1000;
const timePerWord = totalDuration / words.length;


/* RESET */

words.forEach(word => word.classList.remove("highlight"));


/* START LOOP */

words.forEach((word, index)=>{

setTimeout(()=>{

word.classList.add("highlight");

if(index>0){
words[index-1].classList.remove("highlight");
}

}, timePerWord * index);

});

}


/* START HIGHLIGHT WHEN AUDIO PLAYS */

audio.addEventListener("play", highlightWords);


/* RESET WHEN AUDIO ENDS */

audio.addEventListener("ended", ()=>{

words.forEach(word=>word.classList.remove("highlight"));

});

</script>


</body>

</html>
