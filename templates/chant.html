<!DOCTYPE html>
<html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600&family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<title>Chant Visualization | Vakya Vani</title>

<style>

body{
margin:0;
font-family:"Inter", sans-serif;
background:
linear-gradient(rgba(255,255,255,0.9),
rgba(255,255,255,0.9)),
url("https://www.transparenttextures.com/patterns/cream-paper.png");
}


.container{
max-width:1000px;
margin:auto;
padding:60px;
text-align:center;
}


h2{
font-family:"Playfair Display", serif;
letter-spacing:4px;
font-size:44px;
color:#4b2a3a;
}


.meter{
margin-top:20px;
font-size:22px;
}


.translation{
margin-top:15px;
font-size:18px;
color:#555;
}


#chant-container{
margin-top:40px;
line-height:70px;
font-family:"Noto Serif Devanagari", serif;
}


.word{
font-size:38px;
margin-right:14px;
transition:.35s ease;
display:inline-block;
}


.highlight{
color:#d4af37;
text-shadow:
0px 0px 12px rgba(212,175,55,0.9),
0px 0px 25px rgba(212,175,55,0.4);
transform:scale(1.25);
}


audio{
margin-top:40px;
}

</style>

</head>

<body>

{% include "navbar.html" %}

<div class="container">

<h2>Live Chant Visualization</h2>


{% if meter %}
<div class="meter">
Detected Meter: <b>{{ meter }}</b>
</div>
{% endif %}


{% if translation %}
<div class="translation">
{{ translation }}
</div>
{% endif %}


<div id="chant-container">

{% for word in verse.split() %}
<span class="word">{{ word }}</span>
{% endfor %}

</div>


{% if audio %}
<audio id="chant-audio" controls autoplay>
<source src="{{ url_for('static', filename=audio) }}" type="audio/mpeg">
</audio>
{% endif %}

</div>


<script>

const audio = document.getElementById("chant-audio");
const words = document.querySelectorAll(".word");


if(audio){

audio.addEventListener("loadedmetadata", ()=>{

audio.addEventListener("timeupdate", ()=>{

if(!audio.duration) return;

const progress = audio.currentTime / audio.duration;

const activeIndex = Math.floor(progress * words.length);

words.forEach((word, index)=>{

if(index === activeIndex){
word.classList.add("highlight");
}else{
word.classList.remove("highlight");
}

});

});

});


audio.addEventListener("ended", ()=>{

words.forEach(word=>word.classList.remove("highlight"));

});

}

</script>

</body>
</html>
