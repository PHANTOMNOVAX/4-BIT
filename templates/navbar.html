<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet">

<style>

.navbar{

display:flex;
justify-content:space-between;
align-items:center;

background:#4b2a3a;

padding:25px 140px;

height:140px;

position:relative;

}


/* LEFT MENU */

.nav-left{

display:flex;
gap:120px;

}

.nav-left a{

color:white;

font-size:20px;

letter-spacing:3px;

text-decoration:none;

font-family:"Cinzel", serif;

transition:.3s ease;

}


/* RIGHT MENU */

.nav-right{

display:flex;
gap:120px;

}

.nav-right a{

color:white;

font-size:20px;

letter-spacing:3px;

text-decoration:none;

font-family:"Cinzel", serif;

transition:.3s ease;

}


/* CENTER LOGO */

.logo-wrapper{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

text-align:center;

}


/* LOGO IMAGE */

.logo-img{

height:150px;

filter:

drop-shadow(0px 0px 10px rgba(212,175,55,.7))

drop-shadow(0px 0px 25px rgba(212,175,55,.4));

animation:logoFloat 2.8s ease-in-out infinite alternate;

}


/* FLOATING EFFECT */

@keyframes logoFloat{

from{ transform:translateY(-4px); }

to{ transform:translateY(6px); }

}


/* TITLE TEXT */

.brand-name{

font-family:"Cinzel", serif;

font-size:34px;

letter-spacing:10px;

color:#f4e2b6;

text-shadow:

0px 0px 8px rgba(212,175,55,.8),

0px 0px 22px rgba(212,175,55,.45);

margin-top:5px;

}


/* HOVER */

.navbar a:hover{

color:#d4af37;

}

</style>


<div class="navbar">

<div class="nav-left">

<a href="/">Home</a>

<a href="/translate">Translation</a>

</div>


<div class="logo-wrapper">

<img src="/static/images/logo.png" class="logo-img">

<div class="brand-name">

Vakya Vani

</div>

</div>


<div class="nav-right">

<a href="/chant">Chant</a>

<a href="/about">About</a>

</div>

</div>
