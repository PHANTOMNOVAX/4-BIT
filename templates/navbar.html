<style>

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
background:#4b2a3a;
padding:24px 90px;
position:relative;
font-family:Georgia, serif;
}

/* LEFT SIDE LINKS */

.nav-left{
display:flex;
gap:70px;
}

.nav-left a{
color:white;
text-decoration:none;
font-size:18px;
letter-spacing:2px;
transition:0.3s ease;
}

/* RIGHT SIDE LINKS */

.nav-right{
display:flex;
gap:70px;
}

.nav-right a{
color:white;
text-decoration:none;
font-size:18px;
letter-spacing:2px;
transition:0.3s ease;
}

/* CENTER LOGO BLOCK */

.logo-wrapper{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%, -50%);
text-align:center;
}

/* OM LOGO STYLE */

.logo-circle{
height:68px;
width:68px;
background:white;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:36px;
color:#d4af37; /* GOLD OM */
box-shadow:0px 6px 18px rgba(0,0,0,0.35);

animation:logoFloat 2s ease-in-out infinite alternate;
}

/* FLOAT ANIMATION */

@keyframes logoFloat{
from{
transform:translateY(-2px);
}
to{
transform:translateY(6px);
}
}

/* BRAND NAME */

.brand-name{
color:white;
font-size:22px;
letter-spacing:6px;
margin-top:8px;
}

/* HOVER EFFECT */

.nav-left a:hover,
.nav-right a:hover{

}

</style>
