<!DOCTYPE html>
<html>

<head>

<title>Sanskrit Chant Engine</title>

<style>

body {
font-family: "Segoe UI";
background:#f6f2ec;
margin:0;
}

.hero {

height:420px;

background:
linear-gradient(rgba(60,30,40,0.6),
rgba(60,30,40,0.6)),

url("https://images.unsplash.com/photo-1604881987925-67b2c3fa9a3b");

background-size:cover;
color:white;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

text-align:center;
}

.container {

width:75%;
margin:auto;
margin-top:40px;

}

textarea {

width:100%;
height:140px;
font-size:18px;
padding:10px;

}

button {

background:#7a3e65;
color:white;

border:none;
padding:14px 26px;

font-size:18px;

margin-top:20px;

cursor:pointer;

}

.card {

background:white;

padding:25px;

margin-top:30px;

border-radius:12px;

box-shadow:0px 4px 15px rgba(0,0,0,0.08);

}

.line {

font-size:22px;
margin:6px 0;

transition:0.3s;

}

.active-line {

color:#7a3e65;

font-weight:bold;

transform:scale(1.05);

}

</style>

</head>


<body>

<div class="hero">

<h1>Chanda-Melodic Sanskrit Recitation Engine</h1>

<p>

Meter Detection • Translation • Rhythmic Chant Playback

</p>

</div>


<div class="container">

<form method="POST">

<textarea name="verse"
placeholder="Enter Sanskrit stanza"></textarea>

<br>

<button type="submit">

Generate Chant

</button>

</form>


{% if meter %}

<div class="card">

<h3>Detected Meter</h3>

<p>{{ meter }}</p>

</div>


<div class="card">

<h3>Translation</h3>

<p>{{ translation }}</p>

</div>


<div class="card">

<h3>Live Chant Visualization</h3>

<div id="verse-display">

{% for line in lines %}

<div class="line" id="line{{ loop.index0 }}">

{{ line }}

</div>

{% endfor %}

</div>

<br>

<audio id="chantAudio" controls>

<source src="{{ audio }}">

</audio>

</div>

{% endif %}

</div>


<script>

const audio = document.getElementById("chantAudio");

if(audio){

const lines = document.querySelectorAll(".line");

audio.addEventListener("play", () => {

let index = 0;

lines.forEach(l => l.classList.remove("active-line"));

highlight(index);

let interval = setInterval(() => {

index++;

if(index < lines.length){

highlight(index);

}else{

clearInterval(interval);

}

}, 2500); // timing between lines

});

function highlight(i){

lines.forEach(l => l.classList.remove("active-line"));

lines[i].classList.add("active-line");

}

}

</script>


</body>

</html>
