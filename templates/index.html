<!DOCTYPE html>
<html>

<head>
<title>Sanskrit Recitation Website</title>
</head>

<body>

<h2>Sanskrit Verse Translator + Recitation</h2>

<form method="POST">

<textarea name="verse"
rows="4"
cols="50"
placeholder="Enter Sanskrit verse"></textarea>

<br><br>

<button type="submit">Generate</button>

</form>

{% if meter %}

<h3>Detected Meter:</h3>
<p>{{ meter }}</p>

<h3>Translation:</h3>
<p>{{ translation }}</p>

<h3>Audio Output:</h3>

<audio controls>
<source src="{{ audio }}" type="audio/mp3">
</audio>

{% endif %}

</body>

</html>
