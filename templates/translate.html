<!DOCTYPE html>
<html>

<head>
<title>Translation | Vakaya Vani</title>

<style>

body{
margin:0;
background:#ece7e4;
font-family:Georgia, serif;
}

/* PAGE CONTENT */

.container{
max-width:900px;
margin:auto;
padding:60px;
}

textarea{
width:100%;
height:180px;
font-size:18px;
padding:15px;
border-radius:10px;
border:none;
box-shadow:0px 5px 15px rgba(0,0,0,0.15);
}

button{
margin-top:20px;
background:#4b2a3a;
color:white;
padding:14px 30px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#d4af37;
color:black;
}

.result-box{
margin-top:40px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0px 6px 20px rgba(0,0,0,0.15);
}

</style>

</head>

<body>

{% include "navbar.html" %}

<div class="container">

<h2>Enter Sanskrit Verse</h2>

<form method="POST">

<textarea name="verse"></textarea>

<br>

<button type="submit">
Generate Translation
</button>

</form>

{% if translation %}

<div class="result-box">

<h3>Translation</h3>

<p>{{ translation }}</p>

</div>

{% endif %}

</div>

</body>
</html>
