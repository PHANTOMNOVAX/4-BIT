<!DOCTYPE html>
<html>

<head>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Devanagari:wght@400;600&family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<title>Translation | Vakaya Vani</title>



<style>

/* PAGE BACKGROUND */

body{

margin:0;

font-family:"Inter", sans-serif;

background:

linear-gradient(rgba(255,255,255,0.9),
rgba(255,255,255,0.9)),

url("https://www.transparenttextures.com/patterns/cream-paper.png");

color:#2e2e2e;

}



/* MAIN HEADINGS */

h1{

font-family:"Playfair Display", serif;

letter-spacing:5px;

font-size:52px;

color:#4b2a3a;

animation:fadeDown 1.2s ease;

}



/* SECTION HEADINGS */

h2{

font-family:"Playfair Display", serif;

letter-spacing:3px;

color:#4b2a3a;

}



/* NAVBAR LINKS */

.nav-left a,
.nav-right a{

font-family:"Playfair Display", serif;

letter-spacing:3px;

font-size:19px;

color:white;

text-decoration:none;

transition:0.3s ease;

}


.navbar a:hover{

color:#d4af37;

}



/* SANSKRIT VERSE TEXT */

.verse{

font-family:"Noto Serif Devanagari", serif;

font-size:40px;

letter-spacing:2px;

line-height:1.8;

color:#3a2a2a;

animation:verseFade 1.2s ease;

}



/* TRANSLATION TEXT */

.translation{

font-size:18px;

color:#666;

margin-top:10px;

}



/* BUTTON STYLE */

button,
.hero-btn{

background:#d4af37;

color:black;

border:none;

padding:14px 32px;

font-size:18px;

border-radius:10px;

cursor:pointer;

transition:0.3s ease;

}


button:hover,
.hero-btn:hover{

background:#f2d06b;

transform:translateY(-2px);

}



/* CARD STYLE */

.card{

background:white;

padding:40px;

border-radius:18px;

box-shadow:

0px 10px 30px rgba(0,0,0,0.12);

transition:0.3s ease;

}


.card:hover{

transform:translateY(-8px);

}



/* INFO BOX STYLE */

.info-box{

font-family:"Playfair Display", serif;

letter-spacing:2px;

padding:18px 35px;

border-radius:12px;

background:white;

display:inline-block;

margin:10px;

box-shadow:0px 6px 20px rgba(0,0,0,0.12);

}



/* WORD HIGHLIGHT DURING CHANT */

.highlight{

color:#d4af37;

text-shadow:

0px 0px 10px rgba(212,175,55,0.7),

0px 0px 25px rgba(212,175,55,0.45);

transform:scale(1.25);

transition:0.35s ease;

}



/* PAGE ENTRY ANIMATION */

@keyframes fadeDown{

from{

opacity:0;

transform:translateY(-30px);

}

to{

opacity:1;

transform:translateY(0);

}

}



/* VERSE ENTRY ANIMATION */

@keyframes verseFade{

from{

opacity:0;

transform:translateY(25px);

}

to{

opacity:1;

transform:translateY(0);

}

}



/* RESPONSIVE */

@media(max-width:768px){

h1{

font-size:36px;

}

.verse{

font-size:28px;

}

}


body{
margin:0;
background:#ece7e4;
font-family:Georgia, serif;
}

/* PAGE CONTENT */

.container{
max-width:900px;
margin:auto;
padding:60px;
}

textarea{
width:100%;
height:180px;
font-size:18px;
padding:15px;
border-radius:10px;
border:none;
box-shadow:0px 5px 15px rgba(0,0,0,0.15);
}

button{
margin-top:20px;
background:#4b2a3a;
color:white;
padding:14px 30px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#d4af37;
color:black;
}

.result-box{
margin-top:40px;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0px 6px 20px rgba(0,0,0,0.15);
}

</style>

</head>

<body>

{% include "navbar.html" %}

<div class="container">

<h2>Enter Sanskrit Verse</h2>

<form method="POST">

<textarea name="verse"></textarea>

<br>

<button type="submit">
Generate Translation
</button>

</form>

{% if translation %}

<div class="result-box">

<h3>Translation</h3>

<p>{{ translation }}</p>

</div>

{% endif %}

</div>

</body>
</html>
